services:
  git-deploy:
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:3014:3014"
    environment:
      DEPLOY_TOKEN: ${DEPLOY_TOKEN:?Set DEPLOY_TOKEN in your environment or .env file}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/git-deploy:/srv/git-deploy
